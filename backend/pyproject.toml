[project]
name = "ai-api-test-platform-backend"
version = "0.1.0"
description = "AI 接口测试 Agent 平台后端"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "cryptography>=44,<46",
    "python-multipart>=0.0.20,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pgvector>=0.3,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "pyjwt>=2.10,<3.0",
    "pyyaml>=6.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-java>=0.23,<0.24",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
